<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A student-friendly machine learning score estimate demo using synthetic data.">
  <title>{% block title %}StudyWise{% endblock %} | Student Performance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="nav"><a class="brand" href="{{ url_for('home') }}"><span class="brand-mark">S</span> StudyWise</a>
  <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
  <div class="nav-links"><a href="{{ url_for('home') }}">Home</a><a href="{{ url_for('predict_page') }}">Predict</a><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('about') }}">About</a></div>
  <a class="nav-cta" href="{{ url_for('predict_page') }}">Try prediction <span>↗</span></a>
</nav>
<main>{% block content %}{% endblock %}</main>
<footer class="footer"><div class="brand"><span class="brand-mark">S</span> StudyWise</div><p>Learning patterns, made understandable.</p><span class="footer-note">Educational demo · synthetic data · estimates only</span></footer>
<script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
{% block scripts %}{% endblock %}
</body></html>
